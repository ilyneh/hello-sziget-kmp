# Reach the My Lineup tab and confirm it renders either the populated list or
# the empty state (never gets stuck on the Loading/Error state).
#
# Auth note: built with -Psziget.skipGoogleSignIn=true (see maestro/README.md's "Running against
# a mocked backend"), so "Continue with Google" completes via SzigetAuthService.localSignIn()
# deterministically instead of launching Google's native Sign-In UI.
appId: com.ilyne.helloszigetkmp.debug
---
- launchApp:
    clearState: true
- tapOn:
    text: "Continue with Google"
# Bottom nav lives in MainScaffold.kt, outside presentation/feature/lineup/,
# so it has no testTag yet -- fall back to the tab's visible label text
# (Res.string.lineup_title == "My Lineup").
- tapOn:
    text: "My Lineup"
- assertVisible:
    id: "lineup_screen"
# Depending on seed/test data, the screen renders either a populated list or
# the empty state -- assert whichever one actually rendered so the flow
# fails only if NEITHER shows up (which would mean the screen got stuck
# loading or errored out).
- runFlow:
    when:
      visible:
        id: "lineup_empty_state"
    commands:
      - assertVisible:
          id: "lineup_empty_state"
      - assertVisible:
          id: "lineup_empty_title"
- runFlow:
    when:
      visible:
        id: "lineup_list"
    commands:
      - assertVisible:
          id: "lineup_list"
