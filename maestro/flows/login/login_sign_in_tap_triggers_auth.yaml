# Confirms tapping the sign-in button actually kicks off LoginViewModel's
# sign-in flow (button becomes disabled / loading indicator appears) rather
# than being a no-op.
#
# This flow intentionally stops here: with SKIP_GOOGLE_SIGN_IN off (the
# default, and the only mode a release-shaped build ever honors -
# SzigetAuthService.localSignIn() ignores the flag outside debug builds),
# tapping "Continue with Google" hands off to GoogleAuthProvider, which
# launches Google's native Sign-In / account-picker UI (Credential Manager /
# a system activity outside this app's window). Maestro can't reliably
# assert on or drive that surface - it isn't part of this app's Compose
# tree, its content depends on which Google accounts are on the device/
# emulator, and it isn't exposed via testTagsAsResourceId. So this flow only
# verifies the *local* effect of the tap (loading state kicks in) and does
# not attempt to complete sign-in.
#
# See maestro/flows/login/README.md for how a real end-to-end login could be
# made testable (a pre-authorized test Google account on the device, or
# building this app with -Psziget.skipGoogleSignIn=true to exercise the
# existing debug-only local-auth bypass instead of Google).
appId: com.ilyne.helloszigetkmp.debug
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_sign_in_button"
- tapOn:
    id: "login_sign_in_button"
# Either the loading spinner shows briefly before Google's own UI takes
# over, or that UI has already appeared by the time Maestro looks - both are
# acceptable outcomes here since we're only checking the tap wasn't a no-op.
- assertVisible:
    id: "login_loading_indicator"
    optional: true
