# Add Friend is a modal bottom sheet (dialog<AddFriend> in AppNavGraph) - back
# navigation should dismiss it and return to the Profile screen underneath.
#
# Auth: see maestro/flows/common/sign_in.yaml (same as send_friend_request.yaml).
appId: com.ilyne.helloszigetkmp.debug
---
- runFlow: ../common/sign_in.yaml
- tapOn:
    text: "Profile"
- assertVisible:
    text: "Friends"
- tapOn:
    id: "profile_add_friend_button"
- assertVisible:
    id: "addfriend_screen"
- back
- assertNotVisible:
    id: "addfriend_screen"
- assertVisible:
    text: "Friends"
