# Launches the app, signs in (debug builds skip real Google auth via
# SKIP_GOOGLE_SIGN_IN / localSignIn(), so tapping "Continue with Google" is
# enough), navigates to the Discover tab, opens the first artist card, and
# verifies the artist detail bottom sheet renders (title, favorite toggle,
# bio) before toggling the favorite state and dismissing back to Discover.
#
# Assumptions:
# - No debug/test backdoor exists to jump straight to a logged-in state or
#   directly to an artist id, so this flow goes through the real Login ->
#   Main -> Discover -> tap-a-card path.
# - Individual Discover cards share one testTag ("discover_artist_card", see
#   ArtistCard.kt) rather than per-artist ids, since the backend catalog
#   isn't fixed test data - the first card is picked via that id + index: 0.
#   (A generic `text: ".+"` match was tried first but matched the screen's
#   own "Discover" header text before it ever reached the grid, since that
#   selector matches any non-empty text anywhere on screen, not just cards.)
# - Once inside the artist detail sheet, all assertions/taps use the
#   `artistdetail_*` testTags added to ArtistDetailScreen.kt.
appId: com.ilyne.helloszigetkmp.debug
---
- launchApp:
    clearState: true
- assertVisible:
    text: "Continue with Google"
- tapOn:
    text: "Continue with Google"
- assertVisible:
    text: "Discover"
- tapOn:
    text: "Discover"
- assertVisible:
    id: "artistdetail_root"
    optional: true
# Tap the first visible artist card in the Discover grid. Cards share one
# testTag rather than per-artist ids, since card contents come from live
# backend data rather than fixed test fixtures.
- tapOn:
    id: "discover_artist_card"
    index: 0
- assertVisible:
    id: "artistdetail_header"
- assertVisible:
    id: "artistdetail_bio"
- assertVisible:
    id: "artistdetail_favorite_button"
- tapOn:
    id: "artistdetail_favorite_button"
- assertVisible:
    id: "artistdetail_favorite_button"
# Dismiss the modal bottom sheet (swipe down) and confirm we're back on
# Discover, i.e. the sheet's testTag is no longer present.
- swipe:
    start: "50%, 20%"
    end: "50%, 90%"
- assertNotVisible:
    id: "artistdetail_root"
- assertVisible:
    text: "Discover"
