name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :shared doesn't apply the google-services plugin (only :androidApp does), so the
      # Android host tests don't need androidApp/google-services.json.
      - name: Run Android unit tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: shared/build/reports/tests/testAndroidHostTest
          retention-days: 7
