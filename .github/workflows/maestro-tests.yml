name: Maestro tests

on:
  pull_request:
  workflow_dispatch: {}

jobs:
  maestro-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The google-services plugin is applied unconditionally in androidApp/build.gradle.kts,
      # so any Gradle task touching :androidApp (including assembleDebug) fails without this file.
      - name: Write google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Clean up google-services.json
        if: always()
        run: rm -f androidApp/google-services.json

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk
            "$HOME/.maestro/bin/maestro" test .maestro/

      - name: Upload Maestro test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-report
          path: ~/.maestro/tests
          retention-days: 7
